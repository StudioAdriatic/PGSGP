apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getGodotVersion() {
    def godotLibDir = file('../godot-lib')
    if (godotLibDir.exists()) {
        def aarFiles = godotLibDir.listFiles().findAll { it.name.endsWith('.aar') }
        if (!aarFiles.isEmpty()) {
            def match = aarFiles[0].name =~ /godot-lib\.([\d\.]+)\.stable/
            if (match) {
                return match[0][1]
            }
        }
    }
    return "4.6.3" // fallback default
}

def godotVersion = getGodotVersion()
def isLess42 = {
    def parts = godotVersion.split('\\.')
    if (parts.length >= 2) {
        try {
            int major = parts[0].toInteger()
            int minor = parts[1].toInteger()
            if (major < 4) return true
            if (major == 4 && minor < 2) return true
        } catch (NumberFormatException e) {
            // ignore
        }
    }
    return false
}.call()

println "Building for Godot version: ${godotVersion} (Less than 4.2: ${isLess42})"

android {
    namespace "com.studioadriatic.gpgs"
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    sourceSets {
        main {
            if (isLess42) {
                java.srcDirs += 'src/compat/java'
            }
        }
    }

    def libName = project.property("library_name")

    defaultConfig{
        buildConfigField "String", "LIBRARY_NAME", "\"$libName\""
    }

    libraryVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "$libName.${variant.name}.aar"
        }
    }
}

dependencies {
    compileOnly project(":godot-lib")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    
    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:4.1.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    
    // Android testing dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'org.mockito:mockito-android:4.11.0'
}
